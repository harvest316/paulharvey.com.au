  <style>
    :root {
      --bg: #0c0c0c;
      --bg-elevated: #151513;
      --bg-card: #1a1a18;
      --text: #e8e0d8;
      --text-dim: #8a827a;
      --text-muted: #5a534c;
      --accent: #c45d3e;
      --accent-hover: #d4724f;
      --line: rgba(232, 224, 216, 0.06);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Outfit', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      font-weight: 300;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 5vh, 4rem) clamp(1.5rem, 5vw, 4rem);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.018;
      background: repeating-conic-gradient(#e8e0d8 0.00001%, transparent 0.00012%) 0 0 / 200px 200px;
      mix-blend-mode: overlay;
    }

    .page {
      max-width: 640px;
      width: 100%;
    }

    /* Header */
    .header {
      margin-bottom: clamp(2.5rem, 5vh, 4rem);
      animation: fadeInUp 0.7s ease both;
    }

    .back-link {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.3s;
    }

    .back-link:hover { color: var(--accent); }
    .back-link span { margin-right: 0.4em; }

    .header h1 {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .header-rule {
      width: 48px;
      height: 1px;
      background: var(--accent);
      margin: 1rem 0;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    /* Document cards */
    .docs {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .doc {
      animation: fadeInUp 0.6s ease both;
    }

    .doc:nth-child(1) { animation-delay: 0.1s; }
    .doc:nth-child(2) { animation-delay: 0.2s; }
    .doc:nth-child(3) { animation-delay: 0.3s; }

    .doc a {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 3vw, 1.5rem);
      padding: clamp(1rem, 3vw, 1.5rem);
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.3s, background 0.3s, transform 0.2s;
    }

    .doc a:hover {
      border-color: rgba(196, 93, 62, 0.3);
      background: var(--bg-elevated);
      transform: translateY(-2px);
    }

    .doc-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(196, 93, 62, 0.1);
      color: var(--accent);
    }

    .doc-icon svg {
      width: 22px;
      height: 22px;
    }

    .doc-info { flex: 1; min-width: 0; }

    .doc-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(1.05rem, 1.5vw, 1.2rem);
      line-height: 1.3;
      margin-bottom: 0.2rem;
    }

    .doc-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .doc-arrow {
      flex-shrink: 0;
      color: var(--text-muted);
      transition: color 0.3s, transform 0.3s;
    }

    .doc a:hover .doc-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* Footer */
    .footer {
      margin-top: clamp(3rem, 6vh, 5rem);
      text-align: center;
      animation: fadeInUp 0.6s ease 0.4s both;
    }

    .footer a {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer a:hover { color: var(--accent); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
        animation-delay: 0ms !important;
      }
    }

    @media print {
      body { background: #fff; color: #111; }
      body::after { display: none; }
      .doc a { border-color: #ccc; background: #f9f9f9; color: #111; }
      .back-link, .doc-arrow { display: none; }
    }
  </style>
</head>
